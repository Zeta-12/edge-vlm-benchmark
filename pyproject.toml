[project]
name = "edge-vlm-benchmark"
version = "0.1.0"
description = "Small vision-language models on a laptop CPU, iGPU and NPU with OpenVINO GenAI: accuracy vs latency under weight quantization."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Julien Beloin" }]
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=2.0",
    "openvino-genai>=2026.4",
    "pillow>=11.0",
    "psutil>=6.0",
    "requests>=2.32",
]

[project.optional-dependencies]
# only needed to convert HF checkpoints to OpenVINO IR
export = ["optimum-intel[openvino]>=1.27", "torch>=2.6", "torchvision"]

[project.scripts]
evb = "edge_vlm.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edge_vlm"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
